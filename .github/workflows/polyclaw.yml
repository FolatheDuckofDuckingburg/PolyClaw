name: PolyClaw

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  polyclaw:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@polyclaw')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@polyclaw')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@polyclaw')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@polyclaw') || contains(github.event.issue.title, '@polyclaw')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
        with:
          fetch-depth: 1

      - name: Run PolyClaw
        id: polyclaw
        uses: anthropics/polyclaw-action@v1
        with:
          # Authenticate to the PolyClaw API via Workload Identity Federation
          # (the workflow's OIDC token is exchanged for a short-lived access
          # token) instead of a static API key.
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          polyclaw_args: "--model polyclaw-sonnet-4-5-20250929"

