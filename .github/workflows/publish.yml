name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch: # Allows you to manually click "Run workflow" from the GitHub UI

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npmjs.org'

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: |
          # Only runs build if a build script exists in package.json
          npm run build --if-present

      - name: Update Package Configuration Safely
        run: |
          # Automatically ensures public access settings are in place 
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.publishConfig = { access: 'public' };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Push Package to npm Registry
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
